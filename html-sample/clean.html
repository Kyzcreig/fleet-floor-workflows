<!DOCTYPE html><html><head><style>
body { background: #ffffff; color: #1a1a1a; font-family: Georgia, serif; max-width: 68ch; margin: 0 auto; }
h1 { font-size: 2.5rem; letter-spacing: -0.02em; }
.note { border: 1px solid #d4d4d4; padding: 16px; }
.btn { background: #1a1a1a; color: #fff; transition: transform 160ms cubic-bezier(0.23,1,0.32,1); }
.btn:active { transform: scale(0.97); }
</style></head><body>
<h1>Field Notes</h1>
<p>A quiet page about a specific thing.</p>
<div class="note">One bordered note, full border.</div>
<button class="btn">Read more</button>
</body></html>
